name: CI

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3

      - name: Restore tools
        run: dotnet tool restore

      - name: Check code format
        run: dotnet fantomas --check .

      - name: Test release helper
        run: node --test .agents/skills/release-faqt/scripts/wait-for-nuget.test.js

      - name: Pack
        run: dotnet pack -c Release src/Faqt/Faqt.fsproj --output artifacts/packages


  test-local-sources-linux:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3

      - name: Test
        run: dotnet test -c Release -p:DeterministicSourcePaths=false -p:EmbedAllSources=false


  test-embedded-sources-linux:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3

      - name: Test
        run: dotnet test -c Release -p:DeterministicSourcePaths=true -p:EmbedAllSources=true


  test-local-sources-windows:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3

      - name: Test
        run: dotnet test -c Release -p:DeterministicSourcePaths=false -p:EmbedAllSources=false


  test-embedded-sources-windows:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3

      - name: Test
        run: dotnet test -c Release -p:DeterministicSourcePaths=true -p:EmbedAllSources=true


  test-local-sources-macos:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3

      - name: Test
        run: dotnet test -c Release -p:DeterministicSourcePaths=false -p:EmbedAllSources=false


  test-embedded-sources-macos:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3

      - name: Test
        run: dotnet test -c Release -p:DeterministicSourcePaths=true -p:EmbedAllSources=true


  publish:

    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v/')
    permissions:
      contents: read
      id-token: write

    needs:
      - lint
      - test-local-sources-linux
      - test-local-sources-windows
      - test-local-sources-macos
      - test-embedded-sources-linux
      - test-embedded-sources-windows
      - test-embedded-sources-macos

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3

      - name: Pack
        run: dotnet pack -c Release src/Faqt/Faqt.fsproj --output artifacts/packages

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/*.nupkg -s "https://api.nuget.org/v3/index.json" -k "$NUGET_API_KEY" --skip-duplicate
